[pytest]
# asyncio_mode = auto means pytest-asyncio automatically treats every
# "async def test_...()" function as an async test, without needing to
# manually decorate each one with @pytest.mark.asyncio. This is the
# Python testing equivalent of JUnit 5 just naturally supporting test
# methods - here we need one explicit line to unlock the same
# convenience for async functions specifically.
asyncio_mode = auto

# Both of these need to be "session," not the default "function" -
# this ensures ALL tests in this run share ONE event loop, matching
# the lifetime of our module-level singleton clients (redis_client,
# es_client). Without this, any test after the first one to touch
# these clients will hit exactly the "Event loop is closed" error we
# just saw - a real, known gotcha when combining async singletons with
# pytest-asyncio's default per-test isolation.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session