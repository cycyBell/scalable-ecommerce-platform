services:
  catalog-db:
    image: mongo:7
    container_name: catalog-db
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /tmp/mongo-keyfile /data/configdb/mongo-keyfile
        chmod 400 /data/configdb/mongo-keyfile
        chown 999:999 /data/configdb/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - catalog-db-data:/data/db
      - ./mongo-keyfile:/tmp/mongo-keyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u ${MONGO_USERNAME} -p ${MONGO_PASSWORD} --authenticationDatabase admin --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'catalog-db:27017'}]}).ok }\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  catalog-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: catalog-search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - catalog-search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis
    ports:
      - "6380:6379"
    volumes:
      - catalog-redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  product-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-catalog-service
    environment:
      MONGO_HOST: catalog-db
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      ELASTICSEARCH_HOST: catalog-search
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: catalog-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8000:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-search:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: requirements.txt

  # NEW: the production-hardened variant, built from Dockerfile.prod.
  # Note "profiles: [prod]" below - this means this service is
  # EXCLUDED from a plain "docker compose up" by default, since running
  # both the dev and prod variants simultaneously against the same
  # backing datastores isn't something you'd normally want. You
  # explicitly opt into it via "docker compose --profile prod up".
  product-catalog-service-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: product-catalog-service-prod
    profiles: [ "prod" ]
    environment:
      MONGO_HOST: catalog-db
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      ELASTICSEARCH_HOST: catalog-search
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: catalog-redis
      REDIS_PORT: 6379
    ports:
      - "8001:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-search:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy

volumes:
  catalog-db-data:
  catalog-search-data:
  catalog-redis-data:

