services:
  catalog-db:
    image: mongo:7
    container_name: catalog-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - catalog-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  catalog-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: catalog-search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - catalog-search-data:/usr/share/elasticsearch/data
    healthcheck:
      # Elasticsearch's own health API — "yellow" is an acceptable
      # healthy state for a single-node setup (it only reports "green"
      # when data is replicated across multiple nodes, which isn't
      # possible with just one node). Rejecting only on connection
      # failure or an explicit "red" status.
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis
    ports:
      - "6380:6379"
    volumes:
      - catalog-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-catalog-service
    environment:
      MONGO_HOST: catalog-db
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      ELASTICSEARCH_HOST: catalog-search
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: catalog-redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-search:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: requirements.txt

volumes:
  catalog-db-data:
  catalog-search-data:
  catalog-redis-data:

