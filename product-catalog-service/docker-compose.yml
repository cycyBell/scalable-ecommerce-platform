services:
  catalog-db:
    image: mongo:7
    container_name: catalog-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - catalog-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  catalog-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: catalog-search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - catalog-search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis
    ports:
      - "6380:6379"
    volumes:
      - catalog-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-catalog-service
    environment:
      MONGO_HOST: catalog-db
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      ELASTICSEARCH_HOST: catalog-search
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: catalog-redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-search:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: requirements.txt

# NEW: the production-hardened variant, built from Dockerfile.prod.
  # Note "profiles: [prod]" below - this means this service is
  # EXCLUDED from a plain "docker compose up" by default, since running
  # both the dev and prod variants simultaneously against the same
  # backing datastores isn't something you'd normally want. You
  # explicitly opt into it via "docker compose --profile prod up".
  product-catalog-service-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: product-catalog-service-prod
    profiles: ["prod"]
    environment:
      MONGO_HOST: catalog-db
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      ELASTICSEARCH_HOST: catalog-search
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: catalog-redis
      REDIS_PORT: 6379
    ports:
      - "8001:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-search:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy

volumes:
  catalog-db-data:
  catalog-search-data:
  catalog-redis-data:

